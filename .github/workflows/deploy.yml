name: Deploy

# Собирает образ бота, публикует в GHCR и деплоит на сервер по SSH.
# Требует секрет BOT_DEPLOY_SSH_KEY — приватный ключ пользователя deploy
# на zh-gallery.ru. На сервере ключ ограничен forced-command: разрешены
# только status, logs web, deploy <sha> и bot status/logs bot/deploy <sha>
# (см. deploy/ops/zhctl-root и zhbotctl-root в репозитории сайта).

on:
  push:
    branches: [refactor]
  workflow_dispatch:

concurrency:
  group: deploy-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/voltov-tom/zh-gallery-bot

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          BOT_DEPLOY_SSH_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${BOT_DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Нет секрета BOT_DEPLOY_SSH_KEY"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOT_DEPLOY_SSH_KEY" > ~/.ssh/bot_deploy_key
          chmod 600 ~/.ssh/bot_deploy_key

          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              -p 10022 -i ~/.ssh/bot_deploy_key deploy@zh-gallery.ru \
              "bot deploy ${{ github.sha }}"
