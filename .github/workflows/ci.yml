name: CI

on:
  push:
    branches: [refactor]
  pull_request:
  # вызывается из deploy.yml как переиспользуемый workflow
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt ruff

      - name: ruff
        run: ruff check . && ruff format --check .

      - name: pip-audit (CVE в зависимостях)
        run: |
          pip install -q pip-audit
          # база тянется из сети: сетевые сбои ретраим, найденные CVE — нет
          set +e
          for attempt in 1 2 3; do
            pip-audit -r requirements.txt
            status=$?
            [ "$status" -eq 0 ] && exit 0
            if [ "$status" -eq 1 ]; then
              echo "::error::в зависимостях есть известные уязвимости"
              exit 1
            fi
            echo "сетевая ошибка (код $status), попытка $attempt из 3"
            sleep 10
          done
          exit "$status"

      - name: Импорт без сети
        env:
          ZH_GALLERY_BOT_API_KEY: "123456:TEST"
          ZH_GALLERY_API_TOKEN: test-token
          ZH_GALLERY_API_URL: https://zh-gallery.ru
        run: python -c "import main; print('import ok')"
